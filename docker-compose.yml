services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gradmatch_postgres
    environment:
      POSTGRES_USER: gradmatch
      POSTGRES_PASSWORD: gradmatch_dev
      POSTGRES_DB: gradmatch
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradmatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: python -m alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gradmatch:gradmatch_dev@postgres:5432/gradmatch
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gradmatch:gradmatch_dev@postgres:5432/gradmatch
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  streamlit:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gradmatch:gradmatch_dev@postgres:5432/gradmatch
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
