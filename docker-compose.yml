services:
  postgres:
    image: postgres:16-alpine
    container_name: gradmatch_postgres
    environment:
      POSTGRES_USER: gradmatch
      POSTGRES_PASSWORD: gradmatch_dev
      POSTGRES_DB: gradmatch
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradmatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
