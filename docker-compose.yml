services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gradmatch_postgres
    environment:
      POSTGRES_USER: gradmatch
      POSTGRES_PASSWORD: gradmatch_dev
      POSTGRES_DB: gradmatch
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradmatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
